# One-time bootstrap images for the initial Terraform apply.
substitutions:
  _IMAGE_PREFIX: asia-south1-docker.pkg.dev/driven-elixir-499108-i5/factory

steps:
  - id: build-home
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg
      - APP=home
      - --build-arg
      - FACTORY_API_URL=https://factory.markagen.ai
      - --build-arg
      - FACTORY_SHARED_ORIGIN=true
      - -t
      - ${_IMAGE_PREFIX}/home:bootstrap
      - .

  - id: build-weather
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg
      - APP=weather
      - --build-arg
      - FACTORY_API_URL=https://factory.markagen.ai
      - --build-arg
      - FACTORY_SHARED_ORIGIN=true
      - -t
      - ${_IMAGE_PREFIX}/weather:bootstrap
      - .

  - id: build-live-splash
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg
      - APP=live-splash
      - --build-arg
      - FACTORY_API_URL=https://factory.markagen.ai
      - --build-arg
      - FACTORY_SHARED_ORIGIN=true
      - -t
      - ${_IMAGE_PREFIX}/live-splash:bootstrap
      - .

images:
  - ${_IMAGE_PREFIX}/home:bootstrap
  - ${_IMAGE_PREFIX}/weather:bootstrap
  - ${_IMAGE_PREFIX}/live-splash:bootstrap
