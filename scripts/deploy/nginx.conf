map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
map $http_x_forwarded_proto $factory_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
map $http_x_forwarded_host $factory_forwarded_host {
  default $http_x_forwarded_host;
  "" $http_host;
}
server {
  listen 8080;
  server_name _;
  proxy_http_version 1.1;
  proxy_set_header Host $factory_forwarded_host;
  proxy_set_header X-Forwarded-Host $factory_forwarded_host;
  proxy_set_header X-Forwarded-Proto $factory_forwarded_proto;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  location ~ ^/(auth|app)(/|$) { proxy_pass http://api:8000; }
  location /supabase/ { proxy_pass http://api-gw:8000/; }
  location / { proxy_pass http://web:8080; }
}
