# Factory development: three clients plus the pinned official Supabase stack.
name: factory-dev
include:
- path: ./supabase/docker-compose.yml
services:
  home:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/home
      dev"
    environment:
      WATCHPACK_POLLING: 'true'
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
    working_dir: /workspace
    user: 1001:1002
    volumes:
    - .:/workspace
    - home-node-modules:/workspace/node_modules
    - home-pnpm-cache:/pnpm
    ports:
    - 127.0.0.1:3001:3002
    depends_on:
      api-gw:
        condition: service_started
  live-splash:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/live-splash
      dev"
    environment:
      WATCHPACK_POLLING: 'true'
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
    working_dir: /workspace
    user: 1001:1002
    volumes:
    - .:/workspace
    - live-splash-node-modules:/workspace/node_modules
    - live-splash-pnpm-cache:/pnpm
    ports:
    - 127.0.0.1:3002:3000
    depends_on:
      api-gw:
        condition: service_started
  weather:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/weather
      dev"
    environment:
      WATCHPACK_POLLING: 'true'
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
    working_dir: /workspace
    user: 1001:1002
    volumes:
    - .:/workspace
    - weather-node-modules:/workspace/node_modules
    - weather-pnpm-cache:/pnpm
    ports:
    - 127.0.0.1:3003:3001
    depends_on:
      api-gw:
        condition: service_started
volumes:
  home-node-modules: null
  home-pnpm-cache: null
  live-splash-node-modules: null
  live-splash-pnpm-cache: null
  weather-node-modules: null
  weather-pnpm-cache: null
