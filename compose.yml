services:
  photo-feed:
    build:
      context: .
      dockerfile: Containerfile
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/photo-feed dev"
    environment:
      WATCHPACK_POLLING: "true"
    working_dir: /workspace
    user: "1000:1000"
    volumes:
      - .:/workspace:Z
      - photo-feed-node-modules:/workspace/node_modules
      - photo-feed-pnpm-cache:/pnpm
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storybook:
    build:
      context: .
      dockerfile: Containerfile
    command: >-
      sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/ui dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /workspace
    user: "1000:1000"
    volumes:
      - .:/workspace:Z
      - storybook-node-modules:/workspace/node_modules
      - storybook-pnpm-cache:/pnpm
    ports:
      - "127.0.0.1:6006:6006"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:6006'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  photo-feed-node-modules:
  photo-feed-pnpm-cache:
  storybook-node-modules:
  storybook-pnpm-cache:
