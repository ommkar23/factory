# Factory development: three clients, Storybook, API, and the pinned official Supabase stack.
include:
  - path: ./supabase/docker-compose.yml

services:
  volume-init:
    image: alpine:3.22
    command:
      - sh
      - -c
      - >-
        chown -R ${HOST_UID:?HOST_UID required}:${HOST_GID:?HOST_GID required}
        /volumes/home-node-modules /volumes/home-pnpm-cache
        /volumes/live-splash-node-modules /volumes/live-splash-pnpm-cache
        /volumes/weather-node-modules /volumes/weather-pnpm-cache
        /volumes/storybook-node-modules /volumes/storybook-pnpm-cache
    volumes:
      - home-node-modules:/volumes/home-node-modules
      - home-pnpm-cache:/volumes/home-pnpm-cache
      - live-splash-node-modules:/volumes/live-splash-node-modules
      - live-splash-pnpm-cache:/volumes/live-splash-pnpm-cache
      - weather-node-modules:/volumes/weather-node-modules
      - weather-pnpm-cache:/volumes/weather-pnpm-cache
      - storybook-node-modules:/volumes/storybook-node-modules
      - storybook-pnpm-cache:/volumes/storybook-pnpm-cache

  home:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/home dev"
    environment:
      WATCHPACK_POLLING: "true"
      CI: "true"
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
      LIVE_SPLASH_URL: ${FACTORY_PUBLIC_URL:?FACTORY_PUBLIC_URL required}/live-splash
      WEATHER_URL: ${FACTORY_PUBLIC_URL:?FACTORY_PUBLIC_URL required}/weather
      FACTORY_API_URL: http://api:8000
      FACTORY_SHARED_ORIGIN: "true"
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:?DEV_AUTH_SECRET required}
    working_dir: /workspace
    user: ${HOST_UID:?HOST_UID required}:${HOST_GID:?HOST_GID required}
    volumes:
      - .:/workspace
      - home-node-modules:/workspace/node_modules
      - home-pnpm-cache:/pnpm
    depends_on:
      api-gw:
        condition: service_started
      volume-init:
        condition: service_completed_successfully

  live-splash:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/live-splash dev"
    environment:
      WATCHPACK_POLLING: "true"
      CI: "true"
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
      FACTORY_API_URL: http://api:8000
      FACTORY_SHARED_ORIGIN: "true"
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:?DEV_AUTH_SECRET required}
    working_dir: /workspace
    user: ${HOST_UID:?HOST_UID required}:${HOST_GID:?HOST_GID required}
    volumes:
      - .:/workspace
      - live-splash-node-modules:/workspace/node_modules
      - live-splash-pnpm-cache:/pnpm
    depends_on:
      api-gw:
        condition: service_started
      volume-init:
        condition: service_completed_successfully

  weather:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/weather dev"
    environment:
      WATCHPACK_POLLING: "true"
      CI: "true"
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
      FACTORY_API_URL: http://api:8000
      FACTORY_SHARED_ORIGIN: "true"
      DEV_AUTH_SECRET: ${DEV_AUTH_SECRET:?DEV_AUTH_SECRET required}
    working_dir: /workspace
    user: ${HOST_UID:?HOST_UID required}:${HOST_GID:?HOST_GID required}
    volumes:
      - .:/workspace
      - weather-node-modules:/workspace/node_modules
      - weather-pnpm-cache:/pnpm
    depends_on:
      api-gw:
        condition: service_started
      volume-init:
        condition: service_completed_successfully

  storybook:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: sh -c "pnpm install --frozen-lockfile && pnpm --filter @factory/ui dev"
    environment:
      WATCHPACK_POLLING: "true"
      CI: "true"
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      PNPM_HOME: /tmp/pnpm
    working_dir: /workspace
    user: ${HOST_UID:?HOST_UID required}:${HOST_GID:?HOST_GID required}
    volumes:
      - .:/workspace
      - storybook-node-modules:/workspace/node_modules
      - storybook-pnpm-cache:/pnpm
    ports:
      - 127.0.0.1::6006
    depends_on:
      volume-init:
        condition: service_completed_successfully

  api:
    build:
      context: ./services/api
    env_file:
      - path: ./services/api/.env
        required: false
    environment:
      ENVIRONMENT: development
      CORS_ALLOW_ORIGINS: ${FACTORY_PUBLIC_URL:?FACTORY_PUBLIC_URL required}
      SUPABASE_AUTHORIZATION_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL required}
      AUTH_PUBLIC_URL: ${FACTORY_PUBLIC_URL:?FACTORY_PUBLIC_URL required}
    volumes:
      - api-sessions:/data/factory-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")',
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./infra/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 127.0.0.1::8080
    depends_on:
      api:
        condition: service_healthy
      home:
        condition: service_started
      live-splash:
        condition: service_started
      weather:
        condition: service_started

volumes:
  home-node-modules: null
  home-pnpm-cache: null
  live-splash-node-modules: null
  live-splash-pnpm-cache: null
  weather-node-modules: null
  weather-pnpm-cache: null
  storybook-node-modules: null
  storybook-pnpm-cache: null
  api-sessions: null
