name: Feature request
description: Propose a product capability or improvement
title: "[Feature]: "
labels:
  - type:feature
  - status:triage
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who has the problem, and what outcome are they unable to achieve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List measurable conditions for completion.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App or area
      placeholder: app:name or area:shared-ui
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Supporting context
      description: Add research, designs, user feedback, constraints, or alternatives.
