name: New app proposal
description: Propose a new Next.js application in the Factory monorepo
title: "[New app]: "
labels:
  - type:new-app
  - status:triage
body:
  - type: input
    id: name
    attributes:
      label: Proposed app name
      description: Use a short lowercase kebab-case name.
      placeholder: customer-portal
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Users and problem
      description: Identify the target users and the problem this app will solve.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Initial scope
      description: Describe the smallest useful release and explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: reuse
    attributes:
      label: Shared boundaries
      description: Identify known shared contracts/components and which existing apps actually need them.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Approval criteria
      description: List the evidence needed before technical planning begins.
    validations:
      required: true
