name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - type:bug
  - status:triage
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and what should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Go to ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs, screenshots, recordings, or error output with secrets removed.
  - type: input
    id: app
    attributes:
      label: Affected app or area
      placeholder: app:name or area:platform
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that prove the bug is fixed.
    validations:
      required: true
