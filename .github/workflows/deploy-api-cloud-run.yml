name: Deploy Factory API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "services/api/src/**"
      - "services/api/Dockerfile"
      - "services/api/pyproject.toml"
      - ".github/workflows/deploy-api-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Factory API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/api:${{ github.sha }}
      CORS_ALLOW_ORIGINS: https://factory.markagen.ai
      ENVIRONMENT: production
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      AUTH_PUBLIC_URL: https://factory.markagen.ai
      AUTH_ALLOWED_RETURN_PATHS: /,/weather,/live-splash
    steps:
      - uses: actions/checkout@v4

      - name: Test API
        run: >-
          docker run --rm -v "$PWD:/workspace" -w /workspace/services/api
          python:3.12.14-slim sh -c
          "pip install --disable-pip-version-check --root-user-action=ignore -e .[dev] && pytest"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Confirm factory-api infrastructure exists
        run: >-
          gcloud run services describe factory-api
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.CLOUD_RUN_REGION }}"

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push API image
        run: |
          docker build --file services/api/Dockerfile --tag "$IMAGE" services/api
          docker push "$IMAGE"

      - name: Deploy factory-api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: factory-api
          image: ${{ env.IMAGE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          env_vars: |-
            ENVIRONMENT=${{ env.ENVIRONMENT }}
            CORS_ALLOW_ORIGINS=${{ env.CORS_ALLOW_ORIGINS }}
            SUPABASE_URL=${{ env.SUPABASE_URL }}
            SUPABASE_PUBLISHABLE_KEY=${{ env.SUPABASE_PUBLISHABLE_KEY }}
            AUTH_PUBLIC_URL=${{ env.AUTH_PUBLIC_URL }}
            AUTH_ALLOWED_RETURN_PATHS=${{ env.AUTH_ALLOWED_RETURN_PATHS }}
          secrets: |-
            AUTH_SESSION_DATABASE_URL=factory-api-session-database-url:latest
            AUTH_SESSION_ENCRYPTION_KEY=factory-api-session-encryption-key:latest
