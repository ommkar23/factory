name: Deploy Weather to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/weather/app/**"
      - "apps/weather/components/**"
      - "apps/weather/hooks/**"
      - "apps/weather/lib/**"
      - "apps/weather/public/**"
      - "apps/weather/next.config.mjs"
      - "apps/weather/package.json"
      - "apps/weather/postcss.config.mjs"
      - "apps/weather/proxy.js"
      - "packages/auth/src/**"
      - "!packages/auth/src/**/*.stories.*"
      - "packages/auth/package.json"
      - "packages/ui/src/**"
      - "!packages/ui/src/**/*.stories.*"
      - "packages/ui/package.json"
      - "Dockerfile"
      - ".github/workflows/deploy-app-cloud-run.yml"
      - ".github/workflows/deploy-weather-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app-cloud-run.yml
    with:
      app: weather
      service: factory-weather
