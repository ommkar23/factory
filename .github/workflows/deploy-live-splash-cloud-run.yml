name: Deploy Live Splash to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/live-splash/app/**"
      - "apps/live-splash/public/**"
      - "apps/live-splash/next.config.mjs"
      - "apps/live-splash/package.json"
      - "apps/live-splash/postcss.config.mjs"
      - "apps/live-splash/proxy.js"
      - "packages/auth/src/**"
      - "!packages/auth/src/**/*.stories.*"
      - "packages/auth/package.json"
      - "packages/ui/src/**"
      - "!packages/ui/src/**/*.stories.*"
      - "packages/ui/package.json"
      - "Dockerfile"
      - ".github/workflows/deploy-app-cloud-run.yml"
      - ".github/workflows/deploy-live-splash-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app-cloud-run.yml
    with:
      app: live-splash
      service: factory-live-splash
