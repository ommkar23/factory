name: Deploy production to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production services
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      IMAGE_PREFIX: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}
      FACTORY_SHARED_ORIGIN: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      LIVE_SPLASH_URL: https://factory.markagen.ai/live-splash
      WEATHER_URL: https://factory.markagen.ai/weather
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push production images
        run: |
          for app in home weather live-splash; do
            docker build \
              -f Dockerfile \
              --build-arg "APP=$app" \
              --build-arg "FACTORY_SHARED_ORIGIN=$FACTORY_SHARED_ORIGIN" \
              --build-arg "NEXT_PUBLIC_SUPABASE_URL=$NEXT_PUBLIC_SUPABASE_URL" \
              --build-arg "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" \
              --tag "$IMAGE_PREFIX/$app:${{ github.sha }}" \
              .
            docker push "$IMAGE_PREFIX/$app:${{ github.sha }}"
          done

      - name: Deploy factory-home
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: factory-home
          image: ${{ env.IMAGE_PREFIX }}/home:${{ github.sha }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          env_vars: |-
            FACTORY_SHARED_ORIGIN=${{ env.FACTORY_SHARED_ORIGIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            LIVE_SPLASH_URL=${{ env.LIVE_SPLASH_URL }}
            WEATHER_URL=${{ env.WEATHER_URL }}

      - name: Deploy factory-live-splash
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: factory-live-splash
          image: ${{ env.IMAGE_PREFIX }}/live-splash:${{ github.sha }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          env_vars: |-
            FACTORY_SHARED_ORIGIN=${{ env.FACTORY_SHARED_ORIGIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            LIVE_SPLASH_URL=${{ env.LIVE_SPLASH_URL }}
            WEATHER_URL=${{ env.WEATHER_URL }}

      - name: Deploy factory-weather
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: factory-weather
          image: ${{ env.IMAGE_PREFIX }}/weather:${{ github.sha }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          env_vars: |-
            FACTORY_SHARED_ORIGIN=${{ env.FACTORY_SHARED_ORIGIN }}
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            LIVE_SPLASH_URL=${{ env.LIVE_SPLASH_URL }}
            WEATHER_URL=${{ env.WEATHER_URL }}
