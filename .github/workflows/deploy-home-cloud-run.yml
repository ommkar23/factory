name: Deploy unified Home to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/home/**"
      - "apps/live-splash/**"
      - "apps/weather/**"
      - "packages/auth/**"
      - "packages/ui/**"
      - "scripts/unified-web.mjs"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-app-cloud-run.yml"
      - ".github/workflows/deploy-home-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app-cloud-run.yml
