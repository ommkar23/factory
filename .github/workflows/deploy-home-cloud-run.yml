name: Deploy unified Home to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "apps/home/**"
      - "apps/live-splash/**"
      - "apps/weather/**"
      - "packages/auth/**"
      - "packages/ui/**"
      - "scripts/unified-web.mjs"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-home-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy unified Home
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: cloud-run-home-production
      cancel-in-progress: false
    env:
      IMAGE: ${{ vars.GAR_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GAR_REPOSITORY }}/home:${{ github.sha }}
      FACTORY_API_URL: https://factory.markagen.ai
      FACTORY_SHARED_ORIGIN: "true"
      LIVE_SPLASH_URL: https://factory.markagen.ai/live-splash
      WEATHER_URL: https://factory.markagen.ai/weather
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push unified production image
        run: |
          docker build \
            --file Dockerfile \
            --build-arg "FACTORY_API_URL=$FACTORY_API_URL" \
            --build-arg "FACTORY_SHARED_ORIGIN=$FACTORY_SHARED_ORIGIN" \
            --build-arg "LIVE_SPLASH_URL=$LIVE_SPLASH_URL" \
            --build-arg "WEATHER_URL=$WEATHER_URL" \
            --tag "$IMAGE" \
            .
          docker push "$IMAGE"

      - name: Deploy factory-home
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: factory-home
          image: ${{ env.IMAGE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}
          env_vars: |-
            FACTORY_API_URL=${{ env.FACTORY_API_URL }}
            FACTORY_SHARED_ORIGIN=${{ env.FACTORY_SHARED_ORIGIN }}
            LIVE_SPLASH_URL=${{ env.LIVE_SPLASH_URL }}
            WEATHER_URL=${{ env.WEATHER_URL }}
